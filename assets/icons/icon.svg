<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Glowing emblem -->
  <circle cx="256" cy="256" r="180" fill="url(#emblemGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Utensils & monogram emblem -->
  <g fill="#ffffff" transform="translate(256, 230) scale(1.15)">
    <!-- Fork left -->
    <path d="M-80,-70 L-80,-20 Q-80,10 -55,20 L-55,90 Q-55,98 -47,98 Q-39,98 -39,90 L-39,20 Q-14,10 -14,-20 L-14,-70 L-26,-70 L-26,-30 L-36,-30 L-36,-70 L-48,-70 L-48,-30 L-58,-30 L-58,-70 Z" opacity="0.95"/>
    <!-- Knife right -->
    <path d="M40,-70 Q68,-30 68,15 L40,25 L40,90 Q40,98 48,98 Q56,98 56,90 L56,-70 Z" opacity="0.95"/>
  </g>

  <!-- Text: CAFE KAMAAL -->
  <text x="256" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">CAFE KAMAAL</text>
  <text x="256" y="415" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#fbd38d" text-anchor="middle" letter-spacing="4">HOTEL MESS</text>
</svg>
